name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Offline script checks
        run: |
          bash scripts/test-download-kernel-checksum.sh
          bash scripts/test-dockerfile-digests.sh
          bash scripts/test-build-microvms-args.sh
          bash scripts/test-verify-microvm-artifacts.sh
          shellcheck \
            scripts/download-firecracker-kernel.sh \
            scripts/test-download-kernel-checksum.sh \
            scripts/test-dockerfile-digests.sh \
            scripts/build-microvms-docker.sh \
            scripts/test-build-microvms-args.sh \
            scripts/verify-microvm-artifacts.sh \
            scripts/test-verify-microvm-artifacts.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./... -count=1 -timeout 300s

  lightweight-integration-tests:
    name: Lightweight Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run lightweight integration tests
        run: go test ./cmd/aegis ./cmd/aegishub -count=1 -v -timeout 120s

  image-builds:
    name: Image Builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs

      - name: Build all microVM rootfs images
        # Positional args are component names, not the output directory.
        # No args selects DEFAULT_COMPONENTS in the script. sudo strips the
        # caller environment, so pass ROOTFS_DIR and AEGIS_KERNEL_PATH via
        # `sudo env`. The pinned-hash kernel download runs; a mismatch fails
        # this step. The path is under /tmp so it does not depend on HOME.
        run: sudo env ROOTFS_DIR=/tmp/rootfs-templates AEGIS_KERNEL_PATH=/tmp/aegis-kernel/vmlinux ./scripts/build-microvms-docker.sh

      - name: Build aegishub image
        # aegishub is a host child (cmd/aegis startManagedHub execs
        # ./bin/aegishub), not a Firecracker guest, so it is not in
        # DEFAULT_COMPONENTS. Context is the repo root: the Dockerfile copies
        # go.mod, cmd/aegishub, and internal.
        run: docker build -f cmd/aegishub/Dockerfile -t aegis-aegishub:ci .

      - name: Verify built image artifacts
        run: |
          set -euo pipefail
          components_line=$(./scripts/build-microvms-docker.sh --print-default-components)
          read -r -a components <<< "$components_line"
          if [ "${#components[@]}" -eq 0 ]; then
            echo "default component list is empty" >&2
            exit 1
          fi
          ./scripts/verify-microvm-artifacts.sh \
            --kernel /tmp/aegis-kernel/vmlinux \
            /tmp/rootfs-templates \
            "${components[@]}"

      - name: Verify builder scanners run
        run: |
          set -euo pipefail
          # The builder runs these inside the VM for its security gates.
          docker run --rm --entrypoint /usr/local/bin/opa aegis-builder:latest version
          docker run --rm --entrypoint /usr/local/bin/gitleaks aegis-builder:latest version

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Playwright
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        env:
          AEGIS_E2E_FIXTURE: '1'
        run: npm test

  live-test:
    name: Live Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check live test script
        id: live_script
        run: |
          if [ -f scripts/run-live-test.sh ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.live_script.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run live test
        if: steps.live_script.outputs.exists == 'true'
        run: ./scripts/run-live-test.sh --yes

      - name: Skip live test (script missing)
        if: steps.live_script.outputs.exists != 'true'
        run: echo "Skipping live-test job because scripts/run-live-test.sh is not present."

  # In-process integration tests are strictly opt-in — never run automatically.
  # Trigger manually via workflow_dispatch or add the "run-inprocess-tests" label
  # to a PR.
  #
  # SECURITY: These tests use InProcessTaskExecutor which has ZERO isolation.
  # They must NEVER be part of the default CI matrix or release pipelines.
  # See CONTRIBUTING.md for details.
  inprocess-tests:
    name: In-Process Integration Tests (opt-in only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: contains(github.event.pull_request.labels.*.name, 'run-inprocess-tests')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run in-process integration tests
        env:
          AEGISCLAW_INPROCESS_TEST_MODE: unsafe_for_testing_only
        run: >
          go test ./cmd/aegisclaw/
          -tags=inprocesstest
          -run 'TestInProcess'
          -count=1
          -v
          -timeout 60s
