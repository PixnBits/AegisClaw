name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Offline script checks
        run: |
          bash scripts/test-download-kernel-checksum.sh
          bash scripts/test-dockerfile-digests.sh
          bash scripts/test-build-microvms-args.sh
          shellcheck \
            scripts/download-firecracker-kernel.sh \
            scripts/test-download-kernel-checksum.sh \
            scripts/test-dockerfile-digests.sh \
            scripts/build-microvms-docker.sh \
            scripts/test-build-microvms-args.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./... -count=1 -timeout 300s

  lightweight-integration-tests:
    name: Lightweight Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run lightweight integration tests
        run: go test ./cmd/aegis ./cmd/aegishub -count=1 -v -timeout 120s

  image-builds:
    name: Image Builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs

      - name: Build all microVM rootfs images
        # Positional args are component names, not the output directory.
        # No args selects DEFAULT_COMPONENTS in the script. sudo strips the
        # caller environment, so pass ROOTFS_DIR and the kernel opt-out via
        # `sudo env`. Kernel ensure stays fatal when the opt-out is unset.
        run: sudo env ROOTFS_DIR=/tmp/rootfs-templates AEGIS_SKIP_KERNEL_ENSURE=1 ./scripts/build-microvms-docker.sh

      - name: Verify built image artifacts
        run: |
          set -euo pipefail
          rootfs=/tmp/rootfs-templates
          # Same set as DEFAULT_COMPONENTS in scripts/build-microvms-docker.sh.
          components=(
            agent
            project-manager
            web-portal
            builder
            store
            memory
            network-boundary
            court-persona
            court-scribe
          )
          echo "=== rootfs artifacts ==="
          ls -la "$rootfs"/*.img "$rootfs"/*.tar.gz
          echo "=== docker images aegis-* ==="
          docker images 'aegis-*'
          missing=0
          for c in "${components[@]}"; do
            if [ ! -s "$rootfs/${c}.img" ]; then
              echo "MISSING raw image: $rootfs/${c}.img" >&2
              missing=1
            fi
            if [ ! -s "$rootfs/${c}.img.tar.gz" ]; then
              echo "MISSING tarball: $rootfs/${c}.img.tar.gz" >&2
              missing=1
            fi
            if ! docker image inspect "aegis-${c}:latest" >/dev/null 2>&1; then
              echo "MISSING docker image: aegis-${c}:latest" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Image build did not produce every expected component" >&2
            exit 1
          fi
      - name: Verify builder scanners run
        run: |
          set -euo pipefail
          # The builder runs these inside the VM for its security gates.
          docker run --rm --entrypoint /usr/local/bin/opa aegis-builder:latest version
          docker run --rm --entrypoint /usr/local/bin/gitleaks aegis-builder:latest version

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Playwright
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        env:
          AEGIS_E2E_FIXTURE: '1'
        run: npm test

  live-test:
    name: Live Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check live test script
        id: live_script
        run: |
          if [ -f scripts/run-live-test.sh ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.live_script.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run live test
        if: steps.live_script.outputs.exists == 'true'
        run: ./scripts/run-live-test.sh --yes

      - name: Skip live test (script missing)
        if: steps.live_script.outputs.exists != 'true'
        run: echo "Skipping live-test job because scripts/run-live-test.sh is not present."

  # In-process integration tests are strictly opt-in — never run automatically.
  # Trigger manually via workflow_dispatch or add the "run-inprocess-tests" label
  # to a PR.
  #
  # SECURITY: These tests use InProcessTaskExecutor which has ZERO isolation.
  # They must NEVER be part of the default CI matrix or release pipelines.
  # See CONTRIBUTING.md for details.
  inprocess-tests:
    name: In-Process Integration Tests (opt-in only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: contains(github.event.pull_request.labels.*.name, 'run-inprocess-tests')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run in-process integration tests
        env:
          AEGISCLAW_INPROCESS_TEST_MODE: unsafe_for_testing_only
        run: >
          go test ./cmd/aegisclaw/
          -tags=inprocesstest
          -run 'TestInProcess'
          -count=1
          -v
          -timeout 60s
